
openapi: 3.0.3
info:
  title: QA Automation Shop API - Spec Completa
  description: API completa do Northwind Test Platform para importação no Postman (Mock Server)
  version: 2.0.0
  contact:
    name: QA Automation Team
    email: contato@gotasdetecnologia.com.br
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Ambiente Local
  - url: https://northwind-test-platform.vercel.app
    description: Ambiente Produção
tags:
  - name: 🔐 Autenticação
    description: Registro, login e gestão de sessão
  - name: 📦 Produtos
    description: CRUD, busca e validação de produtos
  - name: 🏷️ Categorias
    description: Gestão de categorias e seus produtos
  - name: 🤝 Fornecedores
    description: Gestão de fornecedores e produtos relacionados
  - name: 🛒 Carrinho
    description: Itens do carrinho de compras
  - name: 📦 Pedidos
    description: Criação e acompanhamento de pedidos
  - name: ⭐ Avaliações
    description: Reviews de produtos
  - name: 🚚 Transportadoras
    description: Lista de transportadoras
  - name: 📊 Relatórios
    description: Indicadores e relatórios de desempenho
  - name: 🧪 Debug & Saúde
    description: Endpoints de health check e debug
paths:
  /api/v1/auth/register:
    post:
      tags: [🔐 Autenticação]
      summary: Cadastra novo usuário
      description: Cria uma nova conta de usuário (role 'customer' padrão)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              Sucesso:
                value:
                  full_name: Maria Silva Santos
                  email: maria.silva@exemplo.com.br
                  password: SenhaForte@2024
                  confirmPassword: SenhaForte@2024
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
              examples:
                Cadastro OK:
                  value:
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImEyYmE0NWFmLWUyNTQtNDI0Yi05YmY3LTM4YmY3YjhjY2RhNCIsImVtYWlsIjoibWFyaWEuc2lsdmFAZXhlbXBsby5jb20uYnIiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MjU1ODAwMDAsImV4cCI6MTcyNjE4NDgwMH0.Vvq8p_ZC9F7d3G4tQbXl6zVqLq9n1sB5h8J2k3P4z7Y
                      user:
                        id: a2ba45af-e254-424b-9bf7-38bf7b8ccda4
                        full_name: Maria Silva Santos
                        email: maria.silva@exemplo.com.br
                        role: customer
                    mensagens: [Usuário cadastrado com sucesso!]
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                Campos faltantes:
                  value:
                    data: null
                    mensagens: [Campos obrigatórios não preenchidos: full_name, email, password, confirmPassword.]
                Senhas diferentes:
                  value:
                    data: null
                    mensagens: [As senhas não coincidem. Confirme a senha corretamente.]
        '409':
          description: Conflito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                Email duplicado:
                  value:
                    data: null
                    mensagens: [Já existe um usuário com esse e-mail.]
  /api/v1/auth/login:
    post:
      tags: [🔐 Autenticação]
      summary: Autentica usuário
      description: Retorna token JWT para acesso aos endpoints protegidos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              Admin:
                value: { email: admin@qatest.com, password: Teste@123 }
              Cliente:
                value: { email: maria.silva@exemplo.com.br, password: SenhaForte@2024 }
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                Senha errada:
                  value:
                    data: null
                    mensagens: [E-mail ou senha inválidos.]
        '403':
          description: Usuário inativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                Conta bloqueada:
                  value:
                    data: null
                    mensagens: [Conta de usuário inativa. Entre em contato com o suporte.]
  /api/v1/auth/me:
    get:
      tags: [🔐 Autenticação]
      summary: Dados do usuário logado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados do usuário autenticado
          content:
            application/json:
              example:
                data:
                  user:
                    id: 9a98ee38-14dd-418f-b5ef-414c38abea03
                    email: admin@qatest.com
                    full_name: Administrador QA
                    role: admin
                    phone: (11) 99999-0000
                    address: Av. Paulista, 1000
                    birth_date: 1990-01-15
                    created_at: '2024-08-01T10:00:00.000Z'
                    last_login: '2026-09-06T12:00:00.000Z'
                    is_active: true
                mensagens: [Dados do usuário carregados com sucesso.]
        '401':
          description: Token ausente ou inválido
  /api/v1/products:
    get:
      tags: [📦 Produtos]
      summary: Lista produtos com paginação
      description: Suporta filtros, busca e ordenação
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
          description: Página (inicia em 1)
        - in: query
          name: limit
          schema: { type: integer, default: 10, example: 8 }
          description: Itens por página
        - in: query
          name: search
          schema: { type: string, example: Gamer }
          description: Busca por nome, SKU ou slug
        - in: query
          name: category_id
          schema: { type: integer, example: 1 }
        - in: query
          name: supplier_id
          schema: { type: integer, example: 2 }
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [id, name, price, stock_quantity, sku, created_at]
            example: price
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            example: asc
        - in: query
          name: is_active
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              examples:
                Sucesso:
                  value:
                    data:
                      - id: 1
                        name: Mouse Gamer RGB Pro
                        price: 299.90
                        stock_quantity: 150
                        sku: MGP-2024A
                        category_id: 1
                        supplier_id: 1
                        slug: mouse-gamer-rgb-pro
                        is_active: true
                        image_url: /storage/products/1/image.png
                        created_at: '2024-09-01T10:30:00.000Z'
                        categories: { name: Periféricos }
                        suppliers: { company_name: Tech Solutions Ltda }
                        reviews_count: 28
                        rating: 4.6
                    pagination: { page: 1, totalPages: 12, total: 92 }
                    mensagens: [Produtos carregados com sucesso.]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [📦 Produtos]
      summary: Cria novo produto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
            examples:
              Novo Produto:
                value:
                  name: Teclado Mecânico Wireless
                  price: 549.99
                  stock_quantity: 37
                  sku: TCMW-2024B
                  category_id: 1
                  supplier_id: 1
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              examples:
                OK:
                  value:
                    data:
                      id: 95
                      name: Teclado Mecânico Wireless
                      slug: teclado-mecanico-wireless
                      price: 549.99
                      stock_quantity: 37
                      sku: TCMW-2024B
                      category_id: 1
                      supplier_id: 1
                      created_at: '2026-09-06T14:00:00.000Z'
                    mensagens: [Produto criado com sucesso! Verificado: Salvo no banco Supabase (qvbbrcvqjssrbrcspwtu.supabase.co)]
        '400':
          description: Validação falhou
          content:
            application/json:
              examples:
                Preço zero:
                  value:
                    data: null
                    mensagens: [O preço deve ser um valor positivo maior que zero.]
                Campos obrigatórios:
                  value:
                    data: null
                    mensagens: [Campos obrigatórios não preenchidos: name, sku, price.]
        '404':
          description: Categoria ou fornecedor não existe
          content:
            application/json:
              examples:
                Categoria inválida:
                  value:
                    data: null
                    mensagens: [Categoria selecionada não existe. Escolha uma categoria válida.]
        '409':
          description: SKU ou nome duplicado
          content:
            application/json:
              examples:
                Nome duplicado:
                  value:
                    data: null
                    mensagens: [Já existe um produto com esse nome/slug.]
  /api/v1/products/{id}:
    get:
      tags: [📦 Produtos]
      summary: Detalhes do produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Produto encontrado
        '404':
          description: Produto não encontrado
    put:
      tags: [📦 Produtos]
      summary: Atualiza produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '200': { description: Produto atualizado }
        '404': { description: Produto não encontrado }
    delete:
      tags: [📦 Produtos]
      summary: Remove produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Produto removido
          content:
            application/json:
              example: { mensagens: [Produto removido com sucesso.] }
        '404': { description: Produto não encontrado }
  /api/v1/products/{id}/image:
    post:
      tags: [📦 Produtos]
      summary: Upload imagem PNG do produto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Imagem PNG }
      responses:
        '200':
          description: Upload feito
          content:
            application/json:
              example:
                data: { image_url: /storage/products/1/image.png }
                mensagens: [Imagem PNG atualizada com sucesso.]
        '400':
          description: Arquivo inválido
          content:
            application/json:
              examples:
                Formato errado:
                  value:
                    data: null
                    mensagens:
                      - Apenas arquivos PNG são permitidos para imagem do produto.
                      - Recebido: nome="foto.jpg", tipo="image/jpeg".
  /api/v1/products/search:
    get:
      tags: [📦 Produtos]
      summary: Busca produto por ID / SKU / slug
      parameters:
        - in: query
          name: id
          schema: { type: integer, example: 1 }
        - in: query
          name: sku
          schema: { type: string, example: MGP-2024A }
        - in: query
          name: slug
          schema: { type: string, example: mouse-gamer-rgb-pro }
      responses:
        '200': { description: Produto encontrado }
        '404': { description: Nenhum produto encontrado }
  /api/v1/products/validate:
    post:
      tags: [📦 Produtos]
      summary: Valida dados do produto antes de salvar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '200':
          description: Resultado da validação
          content:
            application/json:
              examples:
                Válido:
                  value:
                    valid: true
                    errors: []
                    warnings: []
                    suggestions: [Considere adicionar descrição detalhada.]
                    message: Produto válido para cadastro
                Inválido:
                  value:
                    valid: false
                    errors:
                      - SKU deve começar com letra maiúscula.
                      - O preço deve ser maior que zero.
                    warnings: []
                    suggestions: []
  /api/v1/categories:
    get:
      tags: [🏷️ Categorias]
      summary: Lista categorias
      parameters:
        - in: query
          name: page
          schema: { type: integer, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, example: 1000 }
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              example:
                data:
                  - id: 1
                    name: Periféricos
                    description: Teclados, mouses, headsets e acessórios
                    slug: perifericos
                  - id: 2
                    name: Eletrônicos
                    description: Produtos de tecnologia em geral
                    slug: eletronicos
                pagination: { page: 1, totalPages: 1, total: 12 }
                mensagens: [Categorias carregadas com sucesso.]
    post:
      tags: [🏷️ Categorias]
      summary: Cria categoria
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Eletrodomésticos
              description: Aparelhos para casa e cozinha
      responses:
        '201':
          description: Categoria criada
        '400':
          description: Dados inválidos
          content:
            application/json:
              example:
                data: null
                mensagens: [Campos obrigatórios não preenchidos: name, description.]
        '409':
          description: Nome duplicado
  /api/v1/categories/{id}/products:
    get:
      tags: [🏷️ Categorias]
      summary: Produtos por categoria
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Produtos da categoria }
        '404': { description: Categoria não encontrada }
  /api/v1/suppliers:
    get:
      tags: [🤝 Fornecedores]
      summary: Lista fornecedores
      responses:
        '200':
          description: Lista
          content:
            application/json:
              example:
                data:
                  - id: 1
                    company_name: Tech Solutions Ltda
                    contact_name: João Silva
                    email: joao@techsolutions.com
                    phone: (11) 98765-4321
                    cnpj: '12345678901234'
                    uf: SP
                mensagens: [Fornecedores carregados com sucesso.]
    post:
      tags: [🤝 Fornecedores]
      summary: Cria fornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreate' }
      responses:
        '201': { description: Fornecedor criado }
        '400': { description: Dados inválidos }
  /api/v1/cart:
    get:
      tags: [🛒 Carrinho]
      summary: Itens do carrinho
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Carrinho
          content:
            application/json:
              example:
                data:
                  - id: 501
                    product_id: 1
                    quantity: 2
                    products:
                      id: 1
                      name: Mouse Gamer RGB Pro
                      price: 299.90
                      sku: MGP-2024A
                      stock_quantity: 150
                mensagens: [Carrinho carregado com sucesso.]
        '404':
          description: Carrinho vazio
          content:
            application/json:
              example:
                data: []
                mensagens: [Seu carrinho está vazio.]
    post:
      tags: [🛒 Carrinho]
      summary: Adiciona item ao carrinho
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { product_id: 1, quantity: 2 }
      responses:
        '201':
          description: Item adicionado
        '400':
          description: Estoque insuficiente
          content:
            application/json:
              example:
                data: null
                mensagens: [Estoque insuficiente. Disponível: 150]
        '404':
          description: Produto não encontrado
  /api/v1/cart/{id}:
    delete:
      tags: [🛒 Carrinho]
      summary: Remove item do carrinho
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 501 }
      responses:
        '200': { description: Item removido }
  /api/v1/orders:
    get:
      tags: [📦 Pedidos]
      summary: Lista pedidos do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista
          content:
            application/json:
              example:
                data:
                  - id: 1001
                    order_number: ORD-20240906-1001
                    status: delivered
                    total_amount: 599.80
                    created_at: '2024-09-06T11:00:00.000Z'
                    shippers: { company_name: Correios SEDEX }
                pagination: { page: 1, totalPages: 2, total: 11 }
    post:
      tags: [📦 Pedidos]
      summary: Cria novo pedido (checkout)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              items:
                - product_id: 1
                  quantity: 2
                  unit_price: 299.90
              shipper_id: 1
              address_id: 5
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              example:
                data:
                  id: 1002
                  order_number: ORD-20240906-1002
                  status: pending
                  total_amount: 599.80
                  created_at: '2024-09-06T14:30:00.000Z'
  /api/v1/orders/{id}:
    get:
      tags: [📦 Pedidos]
      summary: Detalhes do pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1001 }
      responses:
        '200':
          description: Detalhes
          content:
            application/json:
              example:
                data:
                  id: 1001
                  order_number: ORD-20240906-1001
                  status: delivered
                  total_amount: 599.80
                  created_at: '2024-09-06T11:00:00.000Z'
                  order_items:
                    - id: 2001
                      product_id: 1
                      quantity: 2
                      unit_price: 299.90
                      subtotal: 599.80
                      products: { name: Mouse Gamer RGB Pro, sku: MGP-2024A }
  /api/v1/reviews:
    get:
      tags: [⭐ Avaliações]
      summary: Lista avaliações aprovadas
      parameters:
        - in: query
          name: product_id
          schema: { type: integer, example: 1 }
          description: Filtrar por produto
      responses:
        '200':
          description: Avaliações
          content:
            application/json:
              example:
                data:
                  - id: 1
                    product_id: 1
                    user_id: 9a98ee38-14dd-418f-b5ef-414c38abea03
                    order_id: 1001
                    rating: 5
                    title: Excelente mouse!
                    comment: Produto de altíssima qualidade, chegou antes do prazo.
                    is_verified_purchase: true
                    is_approved: true
                    helpful_count: 14
                    created_at: '2024-09-02T09:30:00.000Z'
                    products: { name: Mouse Gamer RGB Pro }
                mensagens: [Avaliações carregadas com sucesso.]
    post:
      tags: [⭐ Avaliações]
      summary: Cria nova avaliação
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Avaliação enviada
        '400':
          description: Rating inválido
          content:
            application/json:
              example:
                data: null
                mensagens: [A nota deve ser um número inteiro entre 1 e 5.]
  /api/v1/reviews/without-reviews:
    get:
      tags: [⭐ Avaliações]
      summary: Produtos vendidos sem avaliação
      description: Query principal do Módulo Reviews - produtos com sales_count > 0 sem reviews
      responses:
        '200':
          description: Produtos pendentes
          content:
            application/json:
              example:
                data:
                  - id: 7
                    name: Monitor 27" 144Hz
                    price: 1799.90
                    sales_count: 34
                  - id: 12
                    name: Notebook Core i7 16GB
                    price: 5299.00
                    sales_count: 18
                mensagens: [Produtos sem avaliação carregados com sucesso.]
  /api/v1/products/{id}/reviews:
    get:
      tags: [⭐ Avaliações]
      summary: Avaliações de um produto + métricas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Avaliações do produto
          content:
            application/json:
              example:
                data:
                  reviews:
                    - id: 1
                      rating: 5
                      title: Excelente!
                      comment: Muito bom.
                      created_at: '2024-09-02T09:30:00.000Z'
                  average_rating: 4.7
                  total_reviews: 28
                mensagens: [Avaliações carregadas com sucesso.]
  /api/v1/shippers:
    get:
      tags: [🚚 Transportadoras]
      summary: Lista transportadoras
      responses:
        '200':
          description: Lista
          content:
            application/json:
              example:
                data:
                  - id: 1
                    company_name: Correios SEDEX
                    phone: (11) 3003-0100
                    email: sedex@correios.com.br
                  - id: 2
                    company_name: Jadlog Express
                    phone: (11) 4002-7200
                    email: atendimento@jadlog.com.br
  /api/v1/reports/top-products:
    get:
      tags: [📊 Relatórios]
      summary: Top produtos por vendas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              example:
                data:
                  - name: Mouse Gamer RGB Pro
                    sales_count: 284
                    total_revenue: 85171.60
                  - name: Teclado Mecânico Wireless
                    sales_count: 192
                    total_revenue: 105598.08
  /api/v1/health:
    get:
      tags: [🧪 Debug & Saúde]
      summary: Health check simples
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: ok
                timestamp: '2026-09-06T14:00:00.000Z'
                uptime: 1d 5h 32m
  /api/v1/keepalive:
    get:
      tags: [🧪 Debug & Saúde]
      summary: Keep Alive (vercel)
      responses:
        '200':
          description: OK
          content:
            text/plain:
              example: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT (sem a palavra "Bearer" na frente)
  schemas:
    RegisterRequest:
      type: object
      required: [full_name, email, password, confirmPassword]
      properties:
        full_name:
          type: string
          example: Maria Silva Santos
          description: Nome completo (3-100 caracteres)
        email:
          type: string
          format: email
          example: maria.silva@exemplo.com.br
        password:
          type: string
          format: password
          example: SenhaForte@2024
          description: Mínimo 8 caracteres, maiúscula, minúscula, número e especial
        confirmPassword:
          type: string
          format: password
          example: SenhaForte@2024
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@qatest.com
        password:
          type: string
          example: Teste@123
    AuthSuccess:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjlhOThlZTM4LTE0ZGQtNDE4Zi1iNWVmLTQxNGMzOGFiZWEwMyIsImVtYWlsIjoiYWRtaW5AcWF0ZXN0LmNvbSIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTc3OTA0NTIwOSwiZXhwIjoxNzc5NjUwMDA5fQ.9pV9V_frwcxxFab3pAc0pTN1FKXc3t-XWEvgSBfzCmo
            user:
              $ref: '#/components/schemas/User'
        mensagens:
          type: array
          items: { type: string }
          example: [Login realizado com sucesso!]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9a98ee38-14dd-418f-b5ef-414c38abea03
        full_name:
          type: string
          example: Administrador QA
        email:
          type: string
          format: email
          example: admin@qatest.com
        role:
          type: string
          enum: [admin, customer]
          example: admin
    ProductCreate:
      type: object
      required: [name, price, stock_quantity, sku, category_id, supplier_id]
      properties:
        name:
          type: string
          minLength: 6
          maxLength: 40
          pattern: "^[a-zA-ZÀ-ÿ\\s]+$"
          example: Mouse Gamer RGB Pro Wireless
        price:
          type: number
          minimum: 0.01
          maximum: 999999.99
          example: 299.90
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 999
          example: 50
        sku:
          type: string
          minLength: 5
          maxLength: 20
          pattern: "^[A-Z][A-Z0-9\\-]*$"
          example: MGP-2024W
        category_id:
          type: integer
          minimum: 1
          example: 1
        supplier_id:
          type: integer
          minimum: 1
          example: 1
    SupplierCreate:
      type: object
      required: [company_name, contact_name, email, phone, cnpj, uf]
      properties:
        company_name: { type: string, minLength: 3, maxLength: 100, example: Tech Solutions Ltda }
        contact_name: { type: string, minLength: 5, maxLength: 80, example: João Silva }
        email: { type: string, format: email, example: joao@techsolutions.com }
        phone: { type: string, example: (11) 98765-4321 }
        cnpj: { type: string, pattern: "^\\d{14}$", example: '12345678901234' }
        uf: { type: string, pattern: "^[A-Z]{2}$", example: SP }
    ReviewCreate:
      type: object
      required: [product_id, rating, comment]
      properties:
        product_id: { type: integer, example: 1 }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        title: { type: string, example: Produto excelente! }
        comment: { type: string, minLength: 10, example: Chegou antes do prazo, qualidade top! }
    ErrorResponse:
      type: object
      properties:
        data: { type: null, nullable: true }
        mensagens:
          type: array
          items: { type: string }
          example: [Erro de validação no campo price.]
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        totalPages: { type: integer, example: 12 }
        total: { type: integer, example: 92 }
  responses:
    Unauthorized:
      description: Não autorizado (ausência/inválidez de token)
      content:
        application/json:
          example:
            data: null
            mensagens: [Token ausente]
    NotFound:
      description: Recurso não encontrado
